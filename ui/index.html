<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toolgate</title>
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunken:#F6F8FA; --ink:#18212F; --ink2:#3A4556; --mute:#6A7586; --line:#DCE1E7; --line2:#E8ECF0;
  --acc:#2F4BD8; --acc-ink:#FFFFFF; --acc-soft:#E8ECFC;
  --ok:#17845A; --ok-soft:#E3F3EB; --warn:#A86A12; --warn-soft:#FBF0DC; --bad:#BE3A16; --bad-soft:#FBE7E1;
  --r-sm:6px; --r:10px; --r-lg:14px;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --shadow:0 1px 2px rgba(24,33,47,.06),0 8px 24px rgba(24,33,47,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F141B; --surface:#161D26; --sunken:#1B232E; --ink:#E6EBF2; --ink2:#C3CBD6; --mute:#8893A3; --line:#2A3441; --line2:#222B36;
  --acc:#7D93FF; --acc-ink:#0F141B; --acc-soft:#202A4A;
  --ok:#4CC28C; --ok-soft:#14291F; --warn:#E3A84A; --warn-soft:#2E2414; --bad:#F07E5C; --bad-soft:#331A13;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none} a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-size:12.5px}
.mute{color:var(--mute)} .small{font-size:12.5px}
.grow{flex:1;min-width:0}
input.switch,.check input.switch{width:34px;height:20px;margin:0;padding:0}
form + .panel,.panel + form,form + details,.panel + details{margin-top:16px}
.sheet-in:focus{outline:none}
h1{font-size:22px;line-height:1.25;margin:0;font-weight:650;letter-spacing:-.015em}
h2{font-size:15px;margin:0;font-weight:650}
h3{font-size:14px;margin:0;font-weight:600}
p{margin:0}

/* shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:18px 12px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:650;font-size:14.5px}
.brand svg{flex:none}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink2);font-weight:500;text-decoration:none}
.nav a svg{width:18px;height:18px;color:var(--mute);flex:none}
.nav a:hover{background:var(--line2)}
.nav a.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(24,33,47,.08)}
.nav a.on svg{color:var(--acc)}
.nav .count{margin-left:auto;font-size:11.5px;font-weight:650;min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:var(--warn-soft);color:var(--warn)}
.side .foot{margin-top:auto;padding:10px;font-size:12px;color:var(--mute);display:flex;gap:8px;align-items:center}
.side .langsw{align-self:flex-start;margin:2px 10px 0;padding:2px}.langsw button{height:22px;padding:0 8px;font-size:11.5px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none;display:inline-block}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
main{min-width:0;padding:28px 36px 80px;max-width:1080px}
.head{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.head .lede{color:var(--mute);margin-top:4px;max-width:62ch}
.head .actions{margin-left:auto;display:flex;gap:8px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--mute);font-size:13px;margin-bottom:12px}

/* controls */
button,.btn{font:inherit;font-weight:500;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;text-decoration:none}
button:hover,.btn:hover{border-color:var(--mute);text-decoration:none}
button svg,.btn svg{width:16px;height:16px}
.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.pri:hover{filter:brightness(1.08);border-color:var(--acc)}
.ghost{border-color:transparent;background:transparent}
.ghost:hover{background:var(--line2);border-color:transparent}
.danger{color:var(--bad)}
button:disabled{opacity:.55;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea{font-family:var(--mono);font-size:12.5px;min-height:120px;resize:vertical}
label.f{display:block;font-weight:550;margin:14px 0 5px;font-size:13px}
label.f .hint{font-weight:400;color:var(--mute)}
.help{color:var(--mute);font-size:12.5px;margin-top:5px}
.switch{position:relative;width:34px;height:20px;flex:none;appearance:none;-webkit-appearance:none;border-radius:10px;background:var(--line);border:0;padding:0;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch:checked{background:var(--acc)} .switch:checked::after{transform:translateX(14px)}
.seg{display:inline-flex;background:var(--line2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{height:28px;border:0;background:transparent;color:var(--ink2);padding:0 11px;border-radius:7px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(24,33,47,.1)}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:600;background:var(--line2);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--acc-soft);color:var(--acc)}
.pill .dot{width:6px;height:6px;background:currentColor}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.panel + .panel{margin-top:16px}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.rows > .r{display:flex;align-items:center;gap:14px;padding:12px 18px;border-top:1px solid var(--line2);min-width:0}
.rows > .r:first-child{border-top:0}
.rows > a.r{color:inherit;text-decoration:none} .rows > a.r:hover{background:var(--sunken)}
.r .main{flex:1;min-width:0} .r .main b{font-weight:600}
.r .sub{color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .meta{color:var(--mute);font-size:12.5px;text-align:right;white-space:nowrap}
.chev{color:var(--mute);width:16px;height:16px;flex:none}
.ico{display:inline-flex;flex:none;border-radius:9px;overflow:hidden;background:#fff;border:1px solid var(--line);align-items:center;justify-content:center}
.ico img{width:66%;height:66%;object-fit:contain}
.ico .fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:700}
.empty{padding:40px 24px;text-align:center;color:var(--mute)}
.empty h2{color:var(--ink);margin-bottom:6px}
.callout{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);margin:0 0 14px}
.callout.bad{background:var(--bad-soft)} .callout.ok{background:var(--ok-soft)} .callout.info{background:var(--acc-soft)}
.callout .grow{flex:1;min-width:0}
pre{font-family:var(--mono);font-size:12.5px;background:var(--sunken);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;margin:8px 0 0;overflow:auto;white-space:pre-wrap;word-break:break-word;max-height:380px}
.copyline{display:flex;gap:8px;align-items:stretch}
.copyline pre{flex:1;margin:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:22px 0 18px}
.tabs a{padding:8px 12px;color:var(--mute);font-weight:550;border-bottom:2px solid transparent;margin-bottom:-1px;text-decoration:none}
.tabs a.on{color:var(--ink);border-color:var(--acc)}
.tabs a .n{font-weight:500;color:var(--mute);margin-left:4px}

/* switchboard */
.board{padding:6px 6px 2px;overflow:hidden}
.board svg{display:block;width:100%;height:auto}
.board text{font:500 12.5px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;fill:var(--ink)}
.board .lbl2{font-size:11px;fill:var(--mute)}
.board .wire{fill:none;stroke-width:1.6}
.board .live{stroke:var(--acc)} .board .idle{stroke:var(--line);stroke-dasharray:3 4}
.board .ok{stroke:var(--ok)} .board .warn{stroke:var(--warn);stroke-dasharray:5 4} .board .bad{stroke:var(--bad);stroke-dasharray:2 4} .board .off{stroke:var(--line);stroke-dasharray:2 5}
.board .node{fill:var(--surface);stroke:var(--line)}
.board .hub{fill:var(--ink)} .board .hubt{fill:var(--bg);font-weight:650}
.board .jack{stroke:var(--surface);stroke-width:2}
@media (prefers-reduced-motion:no-preference){.board .live{stroke-dasharray:6 6;animation:flow 1.6s linear infinite}}
@keyframes flow{to{stroke-dashoffset:-24}}

/* catalog */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar input[type=search]{flex:1;min-width:220px;height:38px;font-size:14.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:10px}
.tile{display:flex;gap:12px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);cursor:pointer;min-width:0;text-align:left;height:auto;font-weight:400;align-items:flex-start;white-space:normal}
.tile:hover{border-color:var(--acc)}
.tile .t{flex:1;min-width:0}
.tile b{font-weight:600;overflow-wrap:anywhere}
.tile .d{color:var(--mute);font-size:12.5px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center;font-size:12px;color:var(--mute)}

/* tools */
.tool{border-top:1px solid var(--line2);padding:11px 18px}
.tool:first-child{border-top:0}
.tool .top{display:flex;gap:12px;align-items:flex-start}
.tool .name{font-family:var(--mono);font-size:13px;font-weight:600}
.tool .desc{color:var(--mute);font-size:12.5px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tool.off .name,.tool.off .desc{opacity:.5}
.runner{margin-top:10px;padding:12px;background:var(--sunken);border-radius:var(--r);border:1px solid var(--line2)}
.pg-f{margin-bottom:12px}.pg-f label.f{margin:0 0 4px}.pg-f .req{color:var(--bad)}.pg-f .ty{font-family:var(--mono);font-size:11.5px;color:var(--mute);font-weight:400;margin-left:6px}
.pg-f textarea{min-height:64px}.pg-out img,.pg-out audio{max-width:100%;margin-top:10px;display:block}
.pg-head{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}

/* activity */
.day{font-size:12.5px;font-weight:600;color:var(--mute);padding:18px 2px 8px}
.ev{display:grid;grid-template-columns:52px 18px 1fr auto;gap:10px;align-items:start;padding:9px 18px;border-top:1px solid var(--line2)}
.ev:first-child{border-top:0}
.ev .time{color:var(--mute);font-size:12.5px;font-variant-numeric:tabular-nums}
.ev .what{min-width:0}
.ev details summary{cursor:pointer;list-style:none}
.ev details summary::-webkit-details-marker{display:none}
.ev .ms{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}

/* sheet & dialogs */
dialog{border:0;padding:0;background:transparent;color:var(--ink);max-width:none;max-height:none}
dialog::backdrop{background:rgba(15,20,27,.32)}
dialog.sheet{position:fixed;inset:0 0 0 auto;margin:0;height:100vh;width:min(560px,100vw)}
.sheet-in{height:100%;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column}
.sheet-h{display:flex;gap:14px;align-items:center;padding:20px 24px 16px;border-bottom:1px solid var(--line2)}
.sheet-b{flex:1;overflow:auto;padding:4px 24px 24px}
.sheet-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 24px;border-top:1px solid var(--line2);background:var(--surface)}
@media (prefers-reduced-motion:no-preference){dialog.sheet[open] .sheet-in{animation:slide .18s ease-out}}
@keyframes slide{from{transform:translateX(24px);opacity:.6}}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);margin-top:8px;cursor:pointer}
.opt.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.opt input{width:auto;margin-top:3px}
ol.steps{margin:10px 0 0;padding-left:20px;color:var(--ink2);font-size:13px} ol.steps li{margin:5px 0}
.flow{display:flex;gap:14px;align-items:center;padding:16px;border-radius:var(--r);background:var(--sunken);margin-top:16px}
.flow.ok{background:var(--ok-soft)} .flow.bad{background:var(--bad-soft)}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;flex:none}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp .8s linear infinite}}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;box-shadow:var(--shadow);max-width:90vw}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;padding:16px 18px;font-size:13px}
.kv dt{color:var(--mute)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
details.adv{margin-top:18px} details.adv summary{cursor:pointer;color:var(--mute);font-size:13px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer;font-size:13.5px}
.check input:not(.switch){width:auto;margin-top:3px}
.tree{border:1px solid var(--line);border-radius:var(--r);margin-top:10px;max-height:340px;overflow:auto}
.tree .srv{padding:8px 12px;border-top:1px solid var(--line2)} .tree .srv:first-child{border-top:0}
.tree .tl{padding-left:28px}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;align-items:center;padding:8px 10px;overflow-x:auto;background:var(--bg);border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0 8px 0 2px}.brand span{display:none}
  .nav{display:flex;gap:2px}.nav a{padding:7px 9px;white-space:nowrap}
  .side .foot{display:none}
  main{padding:20px 16px 60px}
  .grid2{grid-template-columns:1fr}
  .r .meta{display:none}
  .kv{grid-template-columns:1fr}
  .board{display:none}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="var(--ink)"/><circle cx="7" cy="8" r="2" fill="var(--bg)"/><circle cx="7" cy="18" r="2" fill="var(--bg)"/><circle cx="19" cy="13" r="2.4" fill="var(--acc)"/><path d="M9 8c4 0 5 5 8 5M9 18c4 0 5-5 8-5" stroke="var(--bg)" stroke-width="1.4" fill="none"/></svg>
      <span>Toolgate</span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="foot"><span class="dot ok"></span><span>localhost</span></div>
    <div class="seg langsw" id="langsw" role="group"></div>
  </aside>
  <main id="app"></main>
</div>
<dialog id="dlg"></dialog>
<script>
// ---------------------------------------------------------------- basics
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const enc = encodeURIComponent;

// ---------------------------------------------------------------- i18n
// English is the source language. TR (defined near the end) maps English UI
// strings to Turkish; t() falls back to English for anything missing.
// {name} placeholders let the word order differ between languages.
const LANGS = ['en', 'tr'];
let LANG = (() => {
  try { const s = localStorage.getItem('agw_lang'); if (LANGS.includes(s)) return s; } catch {}
  return /^tr/i.test(navigator.language || '') ? 'tr' : 'en';
})();
const LOCALE = () => LANG === 'tr' ? 'tr-TR' : 'en-US';
function t(s, vars) {
  let out = LANG === 'tr' && Object.prototype.hasOwnProperty.call(TR, s) ? TR[s] : s;
  if (vars) out = out.replace(/\{(\w+)\}/g, (m, k) => Object.prototype.hasOwnProperty.call(vars, k) ? String(vars[k]) : m);
  return out;
}
// pl picks the English singular/plural form; Turkish maps both to one string
const pl = (n, one, other, vars) => t(n === 1 ? one : other, { n, ...vars });
// lazy builds a label table on every access, so it follows the current language
const lazy = f => new Proxy({}, {
  get: (_, k) => f()[k], has: (_, k) => k in f(), ownKeys: () => Reflect.ownKeys(f()),
  getOwnPropertyDescriptor: (_, k) => { const o = f(); return k in o ? { value: o[k], writable: true, enumerable: true, configurable: true } : undefined; },
});
function setLang(l, save = true) {
  LANG = LANGS.includes(l) ? l : 'en';
  document.documentElement.lang = LANG;
  if (save) { try { localStorage.setItem('agw_lang', LANG); } catch {} }
}
function renderLangSwitch() {
  const el = $('#langsw'); if (!el) return;
  el.setAttribute('aria-label', t('Language'));
  el.innerHTML = [['en', 'EN', 'English'], ['tr', 'TR', 'Türkçe']].map(([k, l, full]) => `<button type="button" data-lang="${k}" lang="${k}" title="${full}" aria-pressed="${LANG === k}" class="${LANG === k ? 'on' : ''}">${l}</button>`).join('');
  $$('[data-lang]', el).forEach(b => b.onclick = () => {
    if (b.dataset.lang === LANG) return;
    setLang(b.dataset.lang); renderLangSwitch();
    const d = $('#dlg'); if (d.open) d.close();
    if (AUTHED) refreshCounts();
    route();
  });
}
let AUTHED = false;
try { localStorage.removeItem('agw_admin'); } catch {}

const I = {
  plug: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 2v4M13 2v4M5 6h10v3a5 5 0 0 1-10 0V6ZM10 14v4"/></svg>',
  compass: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="7.5"/><path d="m12.8 7.2-1.6 4-4 1.6 1.6-4 4-1.6Z" stroke-linejoin="round"/></svg>',
  bot: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3.5" y="6" width="13" height="10" rx="3"/><path d="M10 3v3M7.5 11h.01M12.5 11h.01"/></svg>',
  key: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="12" r="3.5"/><path d="m9.5 9.5 7-7M14 5l2 2M12 7l1.5 1.5"/></svg>',
  pulse: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10h3.5l2-5 4 10 2-5H18"/></svg>',
  plus: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m8 5 5 5-5 5"/></svg>',
  back: '<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m12 5-5 5 5 5"/></svg>',
  ext: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M11 4h5v5M16 4l-7 7M14 12v4H4V6h4"/></svg>',
  refresh: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M16 10a6 6 0 1 1-2-4.5M16 3v4h-4"/></svg>',
  play: '<svg viewBox="0 0 20 20" fill="currentColor"><path d="M6 4.5v11l9-5.5-9-5.5Z"/></svg>',

async function api(method, path, body) {

  if (s < 60) return t('just now');

  if (s < 86400) return `${t('{n} h ago', { n: Math.floor(s / 3600) })}`;

}

// ---------------------------------------------------------------- status model
function statusOf(s) {
  const st = s.status.status;
  if (!s.config.enabled) return { key: 'off', tone: '', label: t('Off'), wire: 'off' };
  if (s.pending_approval) return { key: 'approval', tone: 'warn', label: t('Awaiting approval'), wire: 'warn', need: t('An agent changed the command this connection runs or the address its credentials are sent to. It stays off until you approve.') };
  if ((s.tool_changes || []).length) return { key: 'approval', tone: 'warn', label: t('Tools changed'), wire: 'warn', need: pl(s.tool_changes.length, '{n} tool is new or has a changed description/schema. Agents can\'t see or call it until you review and approve.', '{n} tools are new or have a changed description/schema. Agents can\'t see or call them until you review and approve.') };
  if ((s.missing_secrets || []).length) return { key: 'secrets', tone: 'warn', label: t('Credentials missing'), wire: 'warn', need: t('The credentials needed to connect are not in the vault.') };
  if (s.status.auth_issue === 'client_required') return { key: 'client', tone: 'warn', label: t('OAuth client required'), wire: 'warn', need: t('This service doesn\'t support automatic client registration. Enter an OAuth client (Client ID and secret) once under Settings.') };
  if (st === 'auth_required') return { key: 'auth', tone: 'warn', label: t('Sign-in needed'), wire: 'warn', need: t('You need to sign in with your account.') };
  if (st === 'error') return { key: 'error', tone: 'bad', label: t('Can\'t connect'), wire: 'bad', need: s.status.error || t('Connection error.') };
  if (st === 'connecting') return { key: 'connecting', tone: 'acc', label: t('Connecting'), wire: 'warn' };
  if (s.needs_login) return { key: 'auth', tone: 'warn', label: t('Not signed in'), wire: 'warn', need: t('The service lists its tools, but you haven\'t signed in, so they won\'t work.') };
  if (st === 'connected') return { key: 'live', tone: 'ok', label: t('Connected'), wire: 'ok' };
  if (s.tool_count > 0) return { key: 'ready', tone: 'ok', label: t('Ready'), wire: 'ok' };
  return { key: 'new', tone: '', label: t('Not connected yet'), wire: 'off', need: t('Hasn\'t connected yet.') };
}

let PENDING_TOKEN = '';

}

function needsLoginPopup(cfg) { return cfg.transport === 'http' && cfg.auth !== 'none' && !(cfg.headers && cfg.headers.Authorization); }

  return w;

async function waitConnected(id, alive, mode = 'connect') {
  const start = Date.now();
  while (Date.now() - start < 15 * 60 * 1000) {
    await new Promise(r => setTimeout(r, 2000));
    if (!alive()) return { cancelled: true };
    const list = await api('GET', '/api/servers').catch(() => null);
    if (!list) continue;
    const s = list.find(x => x.config.id === id);
    if (!s) return { error: t('The connection was deleted.') };
    if (mode === 'login' && s.has_oauth_token) return { tools: s.tool_count };
    if (mode !== 'login' && s.status.status === 'connected' && s.tool_count > 0) return { tools: s.tool_count };
    if (s.status.auth_issue === 'client_required') return { client_required: true, error: t('This service doesn\'t support automatic client registration; enter an OAuth client under Settings.') };
    if (s.status.status === 'error') return { error: s.status.error || t('Connection error.') };
  }
  return { error: t('Sign-in wasn\'t completed within 15 minutes. Try again.') };
}
// Runs the connect flow inside element `box` (in a sheet or page).
async function connectFlow(box, id, name, popup, alive = () => true, mode = 'connect') {
  const set = html => { box.innerHTML = html; bindCopy(box); };
  set(`<div class="flow"><span class="spin"></span><div>${t('Connecting {name}…', { name: esc(name) })}</div></div>`);
  let r;
  try { r = await api('POST', `/api/servers/${enc(id)}/${mode === 'login' ? 'login' : 'connect'}`); }
  catch (e) { if (popup) popup.close(); return set(`<div class="flow bad"><div><b>${t('Couldn\'t connect.')}</b> ${esc(e.message)}</div></div>`), { error: e.message }; }
  if (r.auth_url) {
    if (popup && !popup.closed) popup.location.href = r.auth_url; else window.open(r.auth_url, '_blank');
    set(`<div class="flow"><span class="spin"></span><div class="grow"><b>${t('Sign in on the tab that just opened')}</b><div class="mute small">${t('Once you approve the {name} consent screen, the connection completes here on its own.', { name: esc(name) })}</div>
      <div style="margin-top:10px"><a class="btn" target="_blank" href="${esc(r.auth_url)}">${I.ext} ${t('Reopen the sign-in page')}</a></div></div></div>`);
    r = await waitConnected(id, alive, mode);
    if (r.cancelled) return r;
  } else if (popup) popup.close();
  if (r.client_required) { set(`<div class="flow bad"><div class="grow"><b>${t('OAuth client required.')}</b> <span class="small">${esc(r.error)}</span><div style="margin-top:10px"><a class="btn" href="#c/${enc(id)}?tab=settings">${t('Go to Settings')}</a></div></div></div>`); return { error: r.error }; }
  if (r.logged_in) { set(`<div class="flow ok"><span style="color:var(--ok);width:22px;height:22px">${I.check}</span><div><b>${t('Signed in to {name}', { name: esc(name) })}</b></div></div>`); refreshCounts(); return r; }
  if (r.error) { set(`<div class="flow bad"><div><b>${t('Couldn\'t connect.')}</b> <span class="small">${esc(r.error)}</span></div></div>`); return r; }

  refreshCounts();
  return r;
}

// ---------------------------------------------------------------- switchboard
function boardSVG(agents, servers) {
  const W = 900, rowH = 34, maxRows = 7;
  const A = agents.slice(0, maxRows), S = servers.slice(0, maxRows);
  const moreA = agents.length - A.length, moreS = servers.length - S.length;
  const nA = Math.max(A.length + (moreA ? 1 : 0), 1), nS = Math.max(S.length + (moreS ? 1 : 0), 1);
  const H = Math.max(nA, nS, 3) * rowH + 20;
  const yA = i => 10 + (H - 20 - nA * rowH) / 2 + i * rowH + rowH / 2;
  const yS = i => 10 + (H - 20 - nS * rowH) / 2 + i * rowH + rowH / 2;
  const hx = W / 2, hy = H / 2, ax = 210, sx = W - 210;
  const now = Date.now();
  let g = '';
  A.forEach((a, i) => {
    const live = a.last_seen && now - new Date(a.last_seen).getTime() < 15 * 60 * 1000;
    const y = yA(i);
    g += `<path class="wire ${live ? 'live' : 'idle'}" d="M${ax} ${y} C ${ax + 110} ${y}, ${hx - 140} ${hy}, ${hx - 46} ${hy}"/>`;
    g += `<text x="${ax - 14}" y="${y + 4}" text-anchor="end">${esc(a.name || a.id)}</text><text class="lbl2" x="${ax - 14}" y="${y + 17}" text-anchor="end">${live ? t('active now') : a.last_seen ? relTime(a.last_seen) : t('never connected')}</text>`;
    g += `<circle class="jack" cx="${ax}" cy="${y}" r="4.5" fill="${live ? 'var(--acc)' : 'var(--line)'}"/>`;
  });
  if (moreA) g += `<text class="lbl2" x="${ax - 14}" y="${yA(A.length) + 4}" text-anchor="end">${pl(moreA, '+{n} agent', '+{n} agents')}</text>`;
  if (!A.length) g += `<text class="lbl2" x="${ax - 14}" y="${hy + 4}" text-anchor="end">${t('no agents yet')}</text>`;
  S.forEach((s, i) => {
    const st = statusOf(s), y = yS(i);
    const col = { ok: 'var(--ok)', warn: 'var(--warn)', bad: 'var(--bad)', off: 'var(--line)' }[st.wire];
    g += `<path class="wire ${st.wire}" d="M${hx + 46} ${hy} C ${hx + 140} ${hy}, ${sx - 110} ${y}, ${sx} ${y}"/>`;
    g += `<circle class="jack" cx="${sx}" cy="${y}" r="4.5" fill="${col}"/>`;
    g += `<a href="#c/${enc(s.config.id)}"><text x="${sx + 14}" y="${y + 4}">${esc(s.config.name)}</text><text class="lbl2" x="${sx + 14}" y="${y + 17}">${esc(st.label.toLowerCase())}${s.exposed_count ? ` · ${pl(s.exposed_count, '{n} tool', '{n} tools')}` : ''}</text></a>`;
  });
  if (moreS) g += `<text class="lbl2" x="${sx + 14}" y="${yS(S.length) + 4}">${pl(moreS, '+{n} connection', '+{n} connections')}</text>`;
  if (!S.length) g += `<text class="lbl2" x="${sx + 14}" y="${hy + 4}">${t('no connections yet')}</text>`;
  g += `<rect class="hub" x="${hx - 46}" y="${hy - 20}" width="92" height="40" rx="10"/><text class="hubt" x="${hx}" y="${hy + 4}" text-anchor="middle">gateway</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(pl(servers.length, 'Agents reach {n} connection through the gateway', 'Agents reach {n} connections through the gateway'))}">${g}</svg>`;
}

function seqDiff(A, B) {

  const L = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) { if (A[i] === B[j]) { out.push([' ', A[i]]); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) out.push(['-', A[i++]]); else out.push(['+', B[j++]]); }

}

}

}
function blockDiffHTML(a, b) {
  const d = seqDiff(a.split('\n'), b.split('\n')), keep = new Set();
  d.forEach(([t], i) => { if (t !== ' ') for (let k = i - 2; k <= i + 2; k++) keep.add(k); });
  let out = '', skipped = 0;
  d.forEach(([t, x], i) => {
    if (!keep.has(i)) { skipped++; return; }
    if (skipped) { out += `<div class="mute">  … ${pl(skipped, '{n} line unchanged', '{n} lines unchanged')}</div>`; skipped = 0; }
    const col = t === '-' ? 'var(--bad)' : t === '+' ? 'var(--ok)' : 'var(--mute, inherit)';
    out += `<div style="color:${col}">${t} ${esc(x)}</div>`;

}

  };

    : `${t('Keys named <span class="mono">{prefix}</span> or <span class="mono">{prefix}_…</span> go into this pool. If you add several, the gateway spreads calls across them and moves on to the next when one hits a rate limit.', { prefix: esc(c.prefix) })}`;

async function activityList({ agent = '', q = '', server = '', status = '', limit = 300 }) {

  if (!list.length) return `<div class="panel"><div class="empty"><p>${server ? t('This connection has not been used yet.') : t('No entries.')}</p></div></div>`;

  const today = new Date().toLocaleDateString(LOCALE(), { weekday: 'long', day: 'numeric', month: 'long' });
  return Object.entries(days).map(([day, evs]) => `<div class="day">${day === today ? t('Today') : esc(day)}</div><div class="panel">${evs.map(e => `<div class="ev">
